name: Native libraries

'on':
  push:
    branches:
      - main
      - 'integration/**'
    tags:
      - 'native-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: '28.2.13676358'
  OHOS_SDK_URL: 'https://repo.huaweicloud.com/openharmony/os/5.0.0-Release/ohos-sdk-windows_linux-public.tar.gz'
  OHOS_SDK_SHA256: 'f06a2a8ae38a3cf01c583557f5a4bb1e6e3626df975599aa71f4a59e9af70ecc'
  FLUTTER_CHANNEL: stable
  # Match the upstream base of flutter_ohos (Dart 3.11, Gradle 8.14 templates).
  # Newer stable releases reject the Gradle version flutter_ohos generates.
  FLUTTER_VERSION: '3.41.x'

jobs:
  host-smoke:
    name: Host smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check CI scripts
        run: |
          python3 -m unittest discover -s tool/ci -p 'test_*.py'
          bash -n tool/build_native.sh
          bash -n tool/install_ohos_sdk.sh
      - name: Fetch pinned upstream sources
        run: python3 tool/fetch_sources.py
      - name: Build host library
        run: bash tool/build_native.sh --platform host --out native/build/ci/host
      - name: Run smoke test
        run: ./native/build/ci/host/qfli_git_smoke

  android:
    name: Android (3 ABIs)
    runs-on: ubuntu-24.04
    needs: host-smoke
    if: ${{ !cancelled() }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned Android NDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$sdk_root"
          set +o pipefail
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"
          set -o pipefail
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/$ANDROID_NDK_VERSION" >>"$GITHUB_ENV"
      - name: Fetch pinned upstream sources
        run: python3 tool/fetch_sources.py
      - name: Build Android libraries
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            bash tool/build_native.sh --platform android --abi "$abi" --out "native/build/ci/android/$abi"
          done
      - name: Collect and check Android artifacts
        run: |
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python3 tool/ci/collect_artifacts.py \
            --platform android \
            --out native/build/ci/artifacts/android \
            --library "arm64-v8a=native/build/ci/android/arm64-v8a" \
            --library "armeabi-v7a=native/build/ci/android/armeabi-v7a" \
            --library "x86_64=native/build/ci/android/x86_64" \
            --readelf "$toolchain/llvm-readelf" \
            --nm "$toolchain/llvm-nm" \
            --commit "${{ github.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qfli-git-android-${{ github.sha }}
          path: native/build/ci/artifacts/android/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  ohos:
    name: OpenHarmony (2 ABIs)
    runs-on: ubuntu-24.04
    needs: host-smoke
    if: ${{ !cancelled() }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install checksum-pinned OpenHarmony SDK
        run: |
          bash tool/install_ohos_sdk.sh \
            --url "$OHOS_SDK_URL" \
            --sha256 "$OHOS_SDK_SHA256" \
            --destination "$RUNNER_TEMP/ohos-sdk"
      - name: Fetch pinned upstream sources
        run: python3 tool/fetch_sources.py
      - name: Build OpenHarmony libraries
        run: |
          for abi in arm64-v8a x86_64; do
            bash tool/build_native.sh --platform ohos --abi "$abi" --out "native/build/ci/ohos/$abi"
          done
      - name: Collect and check OpenHarmony artifacts
        run: |
          toolchain="$OHOS_SDK_HOME/native/llvm/bin"
          python3 tool/ci/collect_artifacts.py \
            --platform ohos \
            --out native/build/ci/artifacts/ohos \
            --library "arm64-v8a=native/build/ci/ohos/arm64-v8a" \
            --library "x86_64=native/build/ci/ohos/x86_64" \
            --readelf "$toolchain/llvm-readelf" \
            --nm "$toolchain/llvm-nm" \
            --commit "${{ github.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qfli-git-ohos-${{ github.sha }}
          path: native/build/ci/artifacts/ohos/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  ios:
    name: iOS (device and simulator)
    runs-on: macos-15
    needs: host-smoke
    if: ${{ !cancelled() }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Fetch pinned upstream sources
        run: python3 tool/fetch_sources.py
      - name: Build device framework
        run: bash tool/build_native.sh --platform ios-device --out native/build/ci/ios/device
      - name: Build simulator framework
        run: bash tool/build_native.sh --platform ios-simulator --out native/build/ci/ios/simulator
      - name: Create xcframework
        run: |
          xcodebuild -create-xcframework \
            -framework native/build/ci/ios/device/qfli_git.framework \
            -framework native/build/ci/ios/simulator/qfli_git.framework \
            -output native/build/ci/ios/qfli_git.xcframework
      - name: Collect iOS artifacts
        run: |
          python3 tool/ci/collect_artifacts.py \
            --platform ios \
            --out native/build/ci/artifacts/ios \
            --xcframework native/build/ci/ios/qfli_git.xcframework \
            --abi arm64 \
            --abi x86_64 \
            --commit "${{ github.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qfli-git-ios-${{ github.sha }}
          path: native/build/ci/artifacts/ios/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  example-android:
    name: Example Android APK
    runs-on: ubuntu-24.04
    needs: android
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: qfli-git-android-${{ github.sha }}
          path: native/build/ci/artifacts/android
      - name: Import Android libraries into the plugin
        run: python3 tool/import_artifacts.py --artifact native/build/ci/artifacts/android
      - name: Build example APK
        working-directory: example
        run: bash ../tool/ci/run_annotated.sh example-android flutter build apk --debug

  example-ios:
    name: Example iOS simulator build and test
    runs-on: macos-15
    needs: ios
    if: ${{ !cancelled() && needs.ios.result == 'success' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: qfli-git-ios-${{ github.sha }}
          path: native/build/ci/artifacts/ios
      - name: Import iOS framework into the plugin
        run: python3 tool/import_artifacts.py --artifact native/build/ci/artifacts/ios
      - name: Build example simulator app
        working-directory: example
        run: bash ../tool/ci/run_annotated.sh example-ios flutter build ios --simulator --no-codesign
      - name: Boot an iOS simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, items in sorted(devices.items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for item in items:
                  if item["name"].startswith("iPhone"):
                      print(item["udid"])
                      raise SystemExit
          raise SystemExit("no iPhone simulator available")
          ')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Run example integration test on the simulator
        working-directory: example
        run: bash ../tool/ci/run_annotated.sh example-ios-test flutter test integration_test/flow_test.dart -d "$SIMULATOR_UDID"

  release:
    name: Publish release artifacts
    runs-on: ubuntu-24.04
    needs:
      - android
      - ohos
      - ios
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/native-v') }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
      - name: Zip every platform artifact
        run: |
          cd dist
          for directory in */; do
            name="${directory%/}"
            ( cd "$directory" && zip -r -9 -q "../$name.zip" . ) || exit 1
          done
          sha256sum ./*.zip > SHA256SUMS
          ls -l ./*.zip
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # The job has no checkout, so gh cannot infer the repository.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS \
              --title "$TAG" \
              --notes "libgit2 plus mbedTLS native libraries for Android, iOS and OpenHarmony. Use an asset matching your platform and verify the SHA-256 values in SHA256SUMS."
          fi